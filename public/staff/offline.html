<!doctype html>
<html lang="{{lang}}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>{{title}} | {{name}}</title>
        <style>
            /* Standalone page served from the service worker cache, so it cannot use the app stylesheet.
   Values are the paper, ink, ink-muted, ember tokens from docs/design-system.md. */
            :root {
                color-scheme: light dark;
                --paper: #f7f1e8;
                --ink: #22180f;
                --muted: #6b5a4b;
                --ember: #a0421c;
                --ember-ink: #fff8f0;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --paper: #16110d;
                    --ink: #f2e8da;
                    --muted: #b5a595;
                    --ember: #e8784a;
                    --ember-ink: #1a0f08;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: var(--paper);
                color: var(--ink);
                font:
                    1rem/1.55 system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
            }
            main {
                max-width: 30rem;
            }
            svg {
                width: 48px;
                height: 48px;
                color: var(--ink);
                margin-bottom: 20px;
            }
            h1 {
                margin: 0 0 12px;
                font:
                    600 1.75rem/1.2 Georgia,
                    'Times New Roman',
                    serif;
            }
            p {
                margin: 0 0 28px;
                color: var(--muted);
            }
            button {
                min-height: 48px;
                padding: 0 24px;
                border: 0;
                border-radius: 8px;
                background: var(--ember);
                color: var(--ember-ink);
                font:
                    600 1rem system-ui,
                    sans-serif;
                cursor: pointer;
            }
            button:focus-visible {
                outline: 3px solid var(--ember);
                outline-offset: 3px;
            }
        </style>
    </head>
    <body>
        <main>
            <svg viewBox="0 0 32 32" aria-hidden="true">
                <path
                    d="M5 29V15.5C5 9.15 9.92 4 16 4s11 5.15 11 11.5V29"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                />
                <path
                    d="M16 27c-3.2 0-5-2.1-5-4.6 0-2.9 2.6-4.1 3.4-7.4.9 1.7 1 2.9.6 4.2 1.6-.6 2.9-2.2 3.2-4 1.8 1.8 2.8 4.3 2.8 6.6 0 3-2 5.2-5 5.2Z"
                    fill="var(--ember)"
                />
                <path
                    d="M3 29h26"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                />
            </svg>
            <h1>{{title}}</h1>
            <p>{{body}}</p>
            <button type="button" onclick="location.assign('/staff')">
                {{retry}}
            </button>
        </main>
        <script>
            addEventListener('online', function () {
                location.assign('/staff');
            });
        </script>
    </body>
</html>
